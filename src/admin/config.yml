# Korkodilos — admin for Alex (Sveltia CMS, Decap-compatible).
# Saving in the admin commits to GitHub; Netlify rebuilds the site in ~1 minute.
# Expanded (no YAML anchors/merges) so any YAML parser reads it the same way.
# Repository: github.com/sbilionis/korkodilos-site (private).
backend:
  name: github
  repo: sbilionis/korkodilos-site
  branch: main
site_url: https://korkonew.netlify.app
display_url: https://korkonew.netlify.app
locale: en
media_folder: src/assets/img/uploads
public_folder: /assets/img/uploads
i18n:
  structure: single_file
  locales:
    - el
    - en
  default_locale: el
collections:
  - name: pages
    label: Σελίδες
    label_singular: Σελίδα
    format: json
    i18n: true
    files:
      - name: home
        label: Αρχική
        file: src/_data/home.json
        fields:
          - name: title
            label: Τίτλος καρτέλας (SEO)
            widget: string
            i18n: true
          - name: description
            label: Περιγραφή για Google (SEO)
            widget: text
            i18n: true
          - name: h1
            label: Κρυφός τίτλος σελίδας (για Google/αναγνώστες οθόνης)
            widget: string
            i18n: true
          - name: film
            label: Φωτογραφίες στην αρχή (σειρά που σύρεται)
            widget: list
            i18n: true
            summary: "{{fields.alt}}"
            fields:
              - name: image
                label: Φωτογραφία
                widget: image
                i18n: duplicate
              - name: alt
                label: Περιγραφή φωτογραφίας (για τυφλούς/Google)
