[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"


# design option pages: not for Google
[[headers]]
  for = "/_proposals/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# speed: photos, fonts and icons rarely change → phones keep them for a week instead of re-asking every visit
# (resized photos from the Netlify Image CDN inherit this, so they are reused too)
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, durable"

# CSS and JS carry a build number in their address (see base.njk), so they can be kept for a year
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# pages: the phone may reuse a page for 2 minutes (the site also fetches the menu pages in the background,
# so tapping a page in the menu opens it at once). An admin edit can take up to 2 minutes to show for someone who just loaded that page.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=120, stale-while-revalidate=600"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=120, stale-while-revalidate=600"
[[headers]]
  for = "/en/"
  [headers.values]
    Cache-Control = "public, max-age=120, stale-while-revalidate=600"

# the admin must never be cached (kept last: the last matching rule wins), so Alex always gets the current editor
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/admin/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# old WordPress addresses (korkodilosathens.gr before Oct 2026) → new pages, so Google results and old links keep working
[[redirects]]
  from = "/studio/"
  to = "/studio.html"
  status = 301
[[redirects]]
  from = "/classes/"
  to = "/classes.html"
  status = 301
[[redirects]]
  from = "/calendar/"
  to = "/calendar.html"
  status = 301
[[redirects]]
  from = "/contact/"
  to = "/contact.html"
  status = 301
[[redirects]]
  from = "/author/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-admin/*"
  to = "/admin/"
  status = 301
