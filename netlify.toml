[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# the admin must never be cached, so Alex always gets the current editor
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"

# design option pages: not for Google
[[headers]]
  for = "/_proposals/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# speed: photos, fonts and icons rarely change → phones keep them for a week instead of re-asking every visit
# (resized photos from the Netlify Image CDN inherit this, so they are reused too)
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, durable"

# CSS and JS carry a build number in their address (see base.njk), so they can be kept for a year
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
