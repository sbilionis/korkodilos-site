[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"


# security headers for every address (site and admin):
# never shown inside another site's frame, no guessing of file types, browser always uses https,
# links to other sites don't reveal the full address, and no access to camera/mic/location etc.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

# design option pages: not for Google
[[headers]]
  for = "/_proposals/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# speed: photos, fonts and icons rarely change → phones keep them for a week instead of re-asking every visit
# (resized photos from the Netlify Image CDN inherit this, so they are reused too)
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, durable"

# CSS and JS carry a build number in their address (see base.njk), so they can be kept for a year
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# pages: the browser always checks for a newer version (a tiny "not changed" answer when nothing changed),
# so an admin save shows on the next reload once Netlify has rebuilt (~1 min). Photos/CSS/JS keep their long cache.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/en/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# the admin must never be cached (kept last: the last matching rule wins), so Alex always gets the current editor
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/admin/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# old WordPress addresses (korkodilosathens.gr before Oct 2026) → new pages, so Google results and old links keep working
[[redirects]]
  from = "/studio/"
  to = "/studio.html"
  status = 301
[[redirects]]
  from = "/classes/"
  to = "/classes.html"
  status = 301
[[redirects]]
  from = "/calendar/"
  to = "/calendar.html"
  status = 301
[[redirects]]
  from = "/contact/"
  to = "/contact.html"
  status = 301
[[redirects]]
  from = "/author/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-admin/*"
  to = "/admin/"
  status = 301
