[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# the admin must never be cached, so Alex always gets the current editor
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"

# design option pages: not for Google
[[headers]]
  for = "/_proposals/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
